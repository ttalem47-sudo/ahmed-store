/* Ahmed Store final visual theme */
:root{--navy:#0b2345;--navy2:#173b69;--green:#0b2345;--gold:#d8c9b5;--gold2:#b9a88f;--cream:#f6f1e7;--paper:#fffdf9;--line:#d9d1c4;--muted:#657083}
