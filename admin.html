<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>إدارة Ahmed Store</title>
<style>
:root{--navy:#0b2345;--gold:#c99a3e;--paper:#fffdf8;--bg:#f3eee3;--line:#e2d8c3;--mut:#5d6b7a;--ok:#1f7a4d;--bad:#b3261e}
*{box-sizing:border-box;margin:0}
body{font-family:system-ui,"Segoe UI","Noto Sans Arabic",Tahoma,sans-serif;background:var(--bg);color:var(--navy);min-height:100dvh}
button,input,select,textarea{font:inherit;color:inherit}
header{background:var(--navy);color:#fff;padding:12px 16px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:20}
header img{height:40px;border-radius:9px;background:#fff}header h1{font-size:18px;flex:1}
header button{background:#ffffff22;color:#fff;border:0;border-radius:10px;padding:8px 12px;cursor:pointer}
#tabs{display:flex;gap:8px;overflow-x:auto;padding:12px 14px;scrollbar-width:none}
.chip{flex:none;border:1.5px solid var(--navy);background:transparent;border-radius:999px;padding:8px 16px;font-weight:700;cursor:pointer}
.chip.on{background:var(--navy);color:#fff}
main{max-width:760px;margin:auto;padding:4px 14px 40px}
.box{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.row{display:flex;justify-content:space-between;gap:10px;align-items:center}
.muted{color:var(--mut);font-size:14px}.empty{text-align:center;color:var(--mut);padding:30px}
.btn{border:0;border-radius:11px;padding:10px 14px;font-weight:700;cursor:pointer;background:var(--navy);color:#fff}
.btn.ok{background:var(--ok)}.btn.bad{background:#fff;color:var(--bad);border:1.5px solid var(--bad)}.btn.ghost{background:#fff;color:var(--navy);border:1.5px solid var(--navy)}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
label{display:block;font-weight:700;margin:12px 0 5px;font-size:14px}
input,select,textarea{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:12px;background:#fff}
input[type=checkbox]{width:auto}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:3px solid var(--gold);outline-offset:1px}
.thumb{width:64px;height:64px;border-radius:10px;object-fit:cover;background:#eee;flex:none}
.tag{display:inline-block;border-radius:999px;padding:2px 10px;font-size:12px;font-weight:700;background:var(--bg)}
.sheet{position:fixed;inset:0;background:#0b234599;z-index:40;display:none;align-items:flex-end;justify-content:center}
.sheet.open{display:flex}
.sheet>div{background:var(--paper);width:100%;max-width:560px;max-height:92dvh;overflow-y:auto;border-radius:22px 22px 0 0;padding:18px 16px 0}
.cta{position:sticky;bottom:0;background:var(--paper);padding:12px 0 calc(14px + env(safe-area-inset-bottom));margin-top:14px;display:flex;gap:10px}
.cta .btn{flex:1;padding:14px;font-size:16px}
#login{max-width:380px;margin:12vh auto;padding:0 16px;text-align:center}
#toast{position:fixed;top:70px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 18px;border-radius:12px;z-index:99;display:none;max-width:90%}
#err{position:fixed;inset:auto 8px 8px 8px;background:var(--bad);color:#fff;padding:10px 12px;border-radius:12px;z-index:100;display:none;font-size:13px;direction:ltr;white-space:pre-wrap}
</style>
</head>

<script>
/* ===== إعدادات سوبابيس ===== */
const CFG={url:'https://vnzdojkmoobsbqxnjfld.supabase.co',key:'sb_publishable_XVj-4RTYUTfc4Qgnj24C6A_7NxSM2jd'};
const sb=window.supabase?supabase.createClient(CFG.url,CFG.key):null;

/* ===== أدوات ===== */
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>Number(n||0).toLocaleString('en')+' جنيه';
const img=u=>/^(data:image\/|https:\/\/)/.test(u||'')?u:'';
let tt;const toast=m=>{const t=$('toast');t.textContent=m;t.style.display='block';clearTimeout(tt);tt=setTimeout(()=>t.style.display='none',2800)};
const showErr=m=>{const e=$('err');e.textContent+=m+'\n';e.style.display='block';e.onclick=()=>{e.textContent='';e.style.display='none'}};

addEventListener('unhandledrejection',e=>showErr('Promise: '+((e.reason&&e.reason.message)||e.reason)));

/* ===== الحالة ===== */
const DEF={shop:{name:'Ahmed Store',wa:'249122970741'},categories:[],products:[],regions:[]};
let S=DEF,tab='orders',filter='جديد',orders=[],visits=0,editId=null,pImg='';
const TABS=[['orders','📦 الطلبات'],['offers','🛍️ العروض'],['cats','🗂️ الأقسام'],['regions','📍 المناطق'],['set','⚙️ الإعدادات']];

/* ===== الدخول ===== */
async function boot(){
  if(!sb){$('login').hidden=false;$('lmsg').textContent='تعذر تحميل مكتبة سوبابيس. تحقق من الإنترنت.';return}
  const {data}=await sb.auth.getSession();
  data.session?enter():($('login').hidden=false);
}
async function login(){
  const {error}=await sb.auth.signInWithPassword({email:$('em').value.trim(),password:$('pw').value});
  if(error){$('lmsg').textContent='❌ '+error.message;return}
  $('login').hidden=true;enter();
}
async function enter(){
  $('login').hidden=true;$('app').hidden=false;$('out').hidden=false;
  const r=await sb.from('store_state').select('state').eq('id',1).maybeSingle();
  if(r.data&&r.data.state)S={...DEF,...r.data.state};
  const st=await sb.from('store_stats').select('stats').eq('id',1).maybeSingle();
  visits=(st.data&&st.data.stats&&st.data.stats.visits)||0;
  await loadOrders();draw();
}
async function save(){
  const {error}=await sb.from('store_state').upsert({id:1,state:S,updated_at:new Date().toISOString()},{onConflict:'id'});
  if(error){toast('❌ تعذر الحفظ: '+error.message);return false}
  toast('✅ تم الحفظ');return true;
}
async function loadOrders(){
  const r=await sb.from('orders').select('id,order_number,status,order,created_at').order('created_at',{ascending:false});
  if(r.error)toast('❌ تعذر تحميل الطلبات: '+r.error.message);else orders=r.data||[];
}

/* ===== الرسم ===== */
function draw(){
  $('tabs').innerHTML=TABS.map(([k,n])=>`<button class="chip ${k===tab?'on':''}" data-tab="${k}">${n}</button>`).join('');

}

  const list=orders.filter(o=>o.status===filter);
  return `<div class="box row"><span>👁 الزيارات: <b>${visits}</b></span><button class="btn ghost" data-act="reload">تحديث</button></div>
  <div style="display:flex;gap:8px;margin-bottom:12px">${ST.map(s=>`<button class="chip ${s===filter?'on':''}" data-filter="${s}">${s} (${orders.filter(o=>o.status===s).length})</button>`).join('')}</div>`+
  (list.length?list.map(o=>{const d=o.order||{},c=d.customer||{};return `<div class="box"><div class="row"><b>طلب رقم ${o.order_number}</b><span class="muted">${new Date(o.created_at).toLocaleString('ar-EG')}</span></div>
  <p style="margin-top:6px">👤 ${esc(c.name)} — <a href="tel:${esc(c.phone)}">${esc(c.phone)}</a></p>
  <p class="muted">${d.mode==='pickup'?'🏬 استلام من المحل':`🚚 ${esc(d.region)} — ${esc(c.address)}`}</p>
  <div style="margin-top:8px">${(d.items||[]).map(i=>`<div class="row"><span>${i.qty} × ${esc(i.name)}${i.note?` (${esc(i.note)})`:''}</span><span>${money(i.price*i.qty)}</span></div>`).join('')}</div>
  ${c.notes?`<p class="muted" style="margin-top:6px">📝 ${esc(c.notes)}</p>`:''}
  <div class="row" style="margin-top:8px"><span>التوصيل: ${money(d.deliveryPrice)}</span><b>الإجمالي: ${money(d.total)}</b></div>
  <div class="acts">${o.status==='جديد'?`<button class="btn ok" data-st="تم التسليم" data-id="${o.id}">✅ تم التسليم</button>`:`<button class="btn ghost" data-st="جديد" data-id="${o.id}">↩ إرجاع للجديدة</button>`}
  ${o.status!=='محذوف'?`<button class="btn bad" data-st="محذوف" data-id="${o.id}">🗑 حذف</button>`:`<button class="btn bad" data-del="${o.id}">حذف نهائي</button>`}
  <a class="btn ghost" style="text-decoration:none" target="_blank" href="https://wa.me/${String(c.phone||'').replace(/\D/g,'')}">📲 واتساب</a></div></div>`}).join(''):`<p class="empty">لا توجد طلبات هنا.</p>`);
}
function vOffers(){
  return `<button class="btn" style="width:100%;margin-bottom:12px" data-act="newP">+ إضافة عرض</button>`+
  (S.products.length?S.products.map(p=>`<div class="box row"><div class="row" style="gap:12px;justify-content:flex-start">${img(p.image)?`<img class="thumb" src="${esc(img(p.image))}" alt="">`:'<div class="thumb"></div>'}<div><b>${esc(p.name)}</b><div class="muted">${money(p.price)} · ${esc((S.categories.find(c=>c.id===p.category)||{}).name||'بدون قسم')}</div>${p.soldOut?'<span class="tag">نفدت الكمية</span>':''}</div></div>
  <div class="acts" style="margin:0"><button class="btn ghost" data-editp="${esc(p.id)}">تعديل</button><button class="btn bad" data-delp="${esc(p.id)}">حذف</button></div></div>`).join(''):'<p class="empty">لا توجد عروض. أضف أول عرض.</p>');
}
function vCats(){
  return `<div class="box"><label>اسم قسم جديد</label><input id="newCat"><div class="acts"><button class="btn" data-act="addCat">إضافة القسم</button></div></div>`+
  S.categories.map(c=>`<div class="box row"><b>${esc(c.name)}</b><button class="btn bad" data-delc="${esc(c.id)}">حذف</button></div>`).join('');
}
function vRegions(){
  return `<div class="box"><label>اسم المنطقة</label><input id="rn"><label>سعر التوصيل (جنيه)</label><input id="rp" type="number" inputmode="numeric" min="0"><div class="acts"><button class="btn" data-act="addReg">إضافة المنطقة</button></div></div>`+
  S.regions.map((r,k)=>`<div class="box row"><span><b>${esc(r.name)}</b> — ${money(r.price)}</span><button class="btn bad" data-delr="${k}">حذف</button></div>`).join('');
}
function vSet(){
  return `<div class="box"><label>اسم المتجر</label><input id="sn" value="${esc(S.shop.name)}"><label>رقم واتساب لاستلام الطلبات (بالصيغة الدولية)</label><input id="sw" type="tel" value="${esc(S.shop.wa)}" placeholder="249122970741"><div class="acts"><button class="btn" data-act="saveSet">حفظ الإعدادات</button></div></div>`;
}

/* ===== نموذج العرض ===== */
function openP(id){
  editId=id||null;const p=S.products.find(x=>x.id===id)||{};
  $('pTitle').textContent=id?'تعديل العرض':'عرض جديد';
  $('pn').value=p.name||'';$('pp').value=p.price??'';$('pd').value=p.desc||'';$('ps').checked=!!p.soldOut;$('pf').value='';
  $('pc').innerHTML=S.categories.map(c=>`<option value="${esc(c.id)}" ${c.id===p.category?'selected':''}>${esc(c.name)}</option>`).join('')||'<option value="">أضف قسماً أولاً</option>';
  pImg=p.image||'';$('pv').hidden=!pImg;if(pImg)$('pv').src=pImg;
  $('pSheet').classList.add('open');
}
function readImage(f){
  const r=new FileReader();
  r.onload=()=>{const im=new Image();im.onload=()=>{const m=900,k=Math.min(1,m/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);pImg=c.toDataURL('image/jpeg',.72);$('pv').src=pImg;$('pv').hidden=false};im.src=r.result};
  r.readAsDataURL(f);
}
async function saveP(){
  const name=$('pn').value.trim(),price=Number($('pp').value);
  if(!name||!(price>=0)||$('pp').value==='')return toast('اكتب اسم العرض وسعره');
  const p={id:editId||'p'+Date.now(),name,price,category:$('pc').value,desc:$('pd').value.trim(),image:pImg,soldOut:$('ps').checked};
  const i=S.products.findIndex(x=>x.id===p.id);i>=0?S.products[i]=p:S.products.unshift(p);
  if(await save()){$('pSheet').classList.remove('open');draw()}
}

/* ===== الأحداث ===== */
document.addEventListener('click',async e=>{
  const t=e.target.closest('button');if(!t)return;const d=t.dataset;
  if(d.tab){tab=d.tab;draw()}
  else if(d.filter){filter=d.filter;draw()}
  else if(d.st){const r=await sb.from('orders').update({status:d.st,updated_at:new Date().toISOString()}).eq('id',d.id);if(r.error)return toast('❌ '+r.error.message);await loadOrders();draw()}
  else if(d.del){if(!confirm('حذف الطلب نهائياً؟'))return;const r=await sb.from('orders').delete().eq('id',d.del);if(r.error)return toast('❌ '+r.error.message);await loadOrders();draw()}
  else if(d.act==='reload'){await loadOrders();draw()}
  else if(d.act==='newP'){if(!S.categories.length)return toast('أضف قسماً أولاً من تبويب الأقسام');openP()}
  else if(d.editp)openP(d.editp);
  else if(d.delp){if(!confirm('حذف هذا العرض؟'))return;S.products=S.products.filter(p=>p.id!==d.delp);await save();draw()}
  else if(d.act==='addCat'){const n=$('newCat').value.trim();if(!n)return;S.categories.push({id:'c'+Date.now(),name:n});await save();draw()}
  else if(d.delc){if(!confirm('حذف القسم؟'))return;S.categories=S.categories.filter(c=>c.id!==d.delc);await save();draw()}
  else if(d.act==='addReg'){const n=$('rn').value.trim(),p=Number($('rp').value);if(!n||$('rp').value==='')return toast('اكتب المنطقة وسعر التوصيل');S.regions.push({name:n,price:p});await save();draw()}
  else if(d.delr!==undefined){S.regions.splice(+d.delr,1);await save();draw()}
  else if(d.act==='saveSet'){S.shop={name:$('sn').value.trim()||'Ahmed Store',wa:$('sw').value.replace(/\D/g,'')};await save()}
});
$('inBtn').onclick=login;$('pw').onkeydown=e=>{if(e.key==='Enter')login()};
$('out').onclick=async()=>{await sb.auth.signOut();location.reload()};
$('pSave').onclick=saveP;$('pCancel').onclick=()=>$('pSheet').classList.remove('open');
$('pf').onchange=e=>{if(e.target.files[0])readImage(e.target.files[0])};
boot();
</script>
</body>
</html>
