<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Ahmed Store</title>
<style>
:root{--navy:#0b2345;--gold:#c99a3e;--paper:#fffdf8;--bg:#f3eee3;--line:#e2d8c3;--mut:#5d6b7a;--ok:#1f7a4d;--bad:#b3261e}
*{box-sizing:border-box;margin:0}
body{font-family:system-ui,"Segoe UI","Noto Sans Arabic",Tahoma,sans-serif;background:var(--bg);color:var(--navy);padding-bottom:90px;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
header{background:var(--navy);color:#fff;padding:14px 16px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:20}
header img{height:46px;border-radius:10px;background:#fff}
header h1{font-size:20px;font-weight:800}
#tabs{display:flex;gap:8px;overflow-x:auto;padding:12px 16px;scrollbar-width:none;position:sticky;top:78px;background:var(--bg);z-index:10}
.chip{flex:none;border:1.5px solid var(--navy);background:transparent;border-radius:999px;padding:8px 18px;font-weight:700;cursor:pointer}
.chip.on{background:var(--navy);color:#fff}
#offers{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px;padding:4px 16px 16px;max-width:900px;margin:auto}
.card{background:var(--paper);border:1px solid var(--line);border-radius:14px;overflow:hidden;cursor:pointer;display:flex;flex-direction:column}
.card img{width:100%;aspect-ratio:4/5;object-fit:cover;background:#eee}
.card h3{font-size:15px;padding:10px 10px 2px}
.card b{color:var(--gold);padding:0 10px 10px;font-size:15px}
.card.out{opacity:.55}.card i{font-style:normal;color:var(--bad);padding:0 10px 10px;font-size:13px}
.muted{color:var(--mut);text-align:center;padding:30px 16px;grid-column:1/-1}
#bar{position:fixed;inset:auto 12px calc(12px + env(safe-area-inset-bottom)) 12px;z-index:30;display:none}
#bar button{width:100%;max-width:560px;margin:auto;display:flex;justify-content:space-between;background:var(--gold);color:#1b1300;border:0;border-radius:16px;padding:16px 20px;font-weight:800;font-size:17px;box-shadow:0 10px 30px #0b234555;cursor:pointer}
.sheet{position:fixed;inset:0;background:#0b234599;z-index:40;display:none;align-items:flex-end;justify-content:center}
.sheet.open{display:flex}
.sheet>div{background:var(--paper);width:100%;max-width:560px;max-height:92dvh;overflow-y:auto;border-radius:22px 22px 0 0;padding:20px 18px 0;position:relative}
.sheet h2{font-size:20px;margin-bottom:12px}
.x{position:absolute;top:14px;left:14px;border:0;background:var(--bg);border-radius:50%;width:34px;height:34px;font-size:18px;cursor:pointer}
.sheet img.big{width:100%;max-height:340px;object-fit:cover;border-radius:12px;margin-bottom:12px}
label{display:block;font-weight:700;margin:12px 0 5px;font-size:14px}
input,select,textarea{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:12px;background:#fff}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:3px solid var(--gold);outline-offset:1px}
.qty{display:flex;align-items:center;justify-content:center;gap:20px;margin:14px 0}
.qty button{width:46px;height:46px;border-radius:50%;border:1.5px solid var(--navy);background:#fff;font-size:24px;cursor:pointer}
.qty span{font-size:24px;font-weight:800;min-width:34px;text-align:center}
.cta{position:sticky;bottom:0;background:var(--paper);padding:12px 0 calc(14px + env(safe-area-inset-bottom));margin-top:14px}
.cta button{width:100%;padding:15px;border:0;border-radius:14px;background:var(--navy);color:#fff;font-weight:800;font-size:17px;cursor:pointer}
.cta button:disabled{opacity:.5}
.line{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);align-items:center}
.line button{border:0;background:none;color:var(--bad);font-size:18px;cursor:pointer}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.modes button{padding:12px;border-radius:12px;border:1.5px solid var(--navy);background:#fff;font-weight:700;cursor:pointer}
.modes button.on{background:var(--navy);color:#fff}
.tot{display:flex;justify-content:space-between;font-weight:800;font-size:18px;padding-top:12px}
#toast{position:fixed;top:90px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 18px;border-radius:12px;z-index:99;display:none}
.rcard{background:var(--paper);border:1.5px solid var(--line);border-radius:16px;padding:22px 12px;text-align:center;cursor:pointer;display:flex;flex-direction:column;gap:6px;align-items:center}.rcard b{font-size:18px}.rcard small{color:var(--mut)}.rcard span{font-size:30px}.pick{grid-column:1/-1;font-size:20px;padding:6px 2px}#back{background:#ffffff22;color:#fff;border:0;border-radius:10px;padding:8px 12px;cursor:pointer;font-weight:700}
#splash{position:fixed;inset:0;z-index:200;background:radial-gradient(circle at 50% 40%,#fffdf8,#efe6d2 70%);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;transition:opacity .6s,visibility .6s}
#splash.off{opacity:0;visibility:hidden}
#splash img{width:200px;max-width:60vw;border-radius:18px;box-shadow:0 14px 40px #0b234530;animation:pop .9s cubic-bezier(.2,.9,.3,1.2) both}
#splash p{font-weight:800;letter-spacing:1px;animation:fade 1s .4s both}
@keyframes pop{from{opacity:0;transform:scale(.7)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes bump{50%{transform:scale(1.06)}}
.sheet{display:flex!important;visibility:hidden;opacity:0;transition:opacity .25s,visibility .25s}
.sheet.open{visibility:visible;opacity:1}
.sheet>div{transform:translateY(40px);transition:transform .3s cubic-bezier(.2,.8,.3,1)}
.sheet.open>div{transform:none}
.card,.sec,.rcard{animation:up .45s calc(var(--i,0)*45ms) both;transition:transform .15s}
.card:active,.sec:active,.rcard:active,.chip:active,.cta button:active{transform:scale(.97)}
.pop{animation:bump .4s}
.sec{background:var(--paper);border:1.5px solid var(--line);border-radius:16px;padding:22px 10px;text-align:center;cursor:pointer;display:flex;flex-direction:column;gap:4px;font-size:16px}
.sec b{font-size:17px}.sec small{color:var(--mut)}
#crumb{display:flex;align-items:center;gap:10px;padding:10px 16px}
.gal{display:flex;gap:8px;overflow-x:auto;scroll-snap-type:x mandatory;margin-bottom:12px}
.gal img{flex:0 0 100%;scroll-snap-align:center;max-height:340px;object-fit:cover;border-radius:12px}
.piece{background:var(--bg);border-radius:12px;padding:10px;margin-top:8px;display:grid;grid-template-columns:1fr 1fr;gap:8px}.piece b{grid-column:1/-1}
.note{background:#fff7e0;border:1px solid #ecd9a0;border-radius:12px;padding:10px 12px;margin:0 16px 10px;font-size:14px;max-width:900px}
.sub{font-size:13px;color:var(--mut);padding-right:14px}
[hidden]{display:none!important}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.lb{position:fixed;inset:0;background:#000d;z-index:300;display:none;overflow:auto;touch-action:pinch-zoom pan-x pan-y}
.lb.open{display:block}.lb img{display:block;margin:auto;max-width:100%;max-height:100dvh;object-fit:contain}
.lb.z img{max-width:none;max-height:none;width:240%}
.lb button{position:fixed;top:14px;left:14px;width:42px;height:42px;border-radius:50%;border:0;background:#fff;font-size:20px;z-index:2;cursor:pointer}
.top{display:flex;align-items:center;gap:12px;padding:10px 16px;max-width:620px;margin:auto}
.steps{display:flex;gap:6px;flex:1}.steps i{flex:1;height:6px;border-radius:6px;background:var(--line)}.steps i.on{background:var(--gold)}
.page{max-width:620px;margin:auto;padding:4px 16px 110px}
.bx{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:12px}
.opt{display:flex;gap:12px;align-items:center;border:2px solid var(--line);background:var(--paper);border-radius:14px;padding:14px;margin-bottom:10px;cursor:pointer;width:100%;text-align:right;transition:border-color .2s,background .2s}
.opt.on{border-color:var(--navy);background:#eef2f9}.opt b{flex:1}.opt small{display:block;color:var(--mut);font-weight:400}
.it{display:flex;gap:12px;align-items:center}.it img,.it .ph{width:64px;height:64px;border-radius:10px;object-fit:cover;background:#eee;flex:none}
.tg{display:inline-block;background:var(--bg);border-radius:999px;padding:4px 12px;font-size:13px;font-weight:700;margin:3px 0 0 4px}
.gal img{cursor:zoom-in}.mini{display:flex;align-items:center;gap:12px;margin-top:8px}.mini button{width:36px;height:36px;border-radius:50%;border:1.5px solid var(--navy);background:#fff;font-size:20px;cursor:pointer}
.pg{animation:up .35s both}
.rcard[disabled]{opacity:.55;cursor:not-allowed}
</style>
</head>

/* ===== المناطق والتنقل ===== */
function openRegions(){
  $('regList').innerHTML=S.regions.map((r,i)=>`<button type="button" class="rcard" style="--i:${i}" data-reg="${esc(r.id)}" ${r.closed?'disabled':''}><span>📍</span><b>${esc(r.name)}</b>${r.closed?'<small>مغلقة مؤقتاً</small>':''}</button>`).join('');
  if(shipWa())$('regList').insertAdjacentHTML('beforeend',`<a class="rcard" style="flex-direction:row;justify-content:center;gap:10px;text-decoration:none;color:inherit" target="_blank" rel="noopener" href="${esc(shipUrl())}"><span style="font-size:22px">📦</span><b>للإرساليات (مدينة أخرى) — واتساب</b></a>`);
  openS('regSheet');
}
function pickReg(id,force){
  if(!force&&cart.length&&(!R||R.id!==id)&&!confirm('سيتم الاحتفاظ بطلبك في منطقته. متابعة؟'))return;
  R=S.regions.find(r=>r.id===id);cat=null;ship=null;loadCart();closeS('regSheet');
  if(cart.length)toast('استعدنا طلبك السابق في هذه المنطقة');
  go({v:'secs'},true);scrollTo(0,0);
}
function go(s,replace){st=s;history[replace?'replaceState':'pushState'](s,'');show()}
addEventListener('popstate',e=>{st=e.state||{v:'secs'};if(R)show()});

function show(){
  if(!R)return;
  const v=st.v,flow=['cart','ship','info'].includes(v),grid=['secs','list'].includes(v);
  $('back').hidden=false;$('back').textContent='📍 '+R.name;
  $('top').hidden=!flow;$('crumb').hidden=v!=='list';$('note').hidden=!grid;
  $('offers').hidden=!grid;$('page').hidden=grid;
  $('note').innerHTML=R.note?`<div class="note">📢 ${esc(R.note)}</div>`:'';
  $('steps').innerHTML=[0,1,2].map(i=>`<i class="${i<=['cart','ship','info'].indexOf(v)?'on':''}"></i>`).join('');
  ({secs:vSecs,list:vList,offer:vOffer,cart:vCart,ship:vShip,info:vInfo})[v]();
  $('bar').style.display=cnt()&&!flow?'block':'none';
  $('barBtn').innerHTML=`<span>🛒 إتمام الطلب (${cnt()})</span><span>${money(sub())}</span>`;
  if(!grid){$('page').classList.remove('pg');void $('page').offsetWidth;$('page').classList.add('pg')}
}
const shown=()=>R.products.filter(p=>!p.hidden);

/* ===== الأقسام والعروض ===== */
const shipWa=()=>String(S.shop.shipWa||S.shop.wa||'').replace(/\D/g,'');
const shipUrl=()=>`https://wa.me/${shipWa()}?text=${encodeURIComponent('السلام عليكم، أريد إرسالية إلى مدينة أخرى. أرجو التفاصيل.')}`;
function vSecs(){vSecs0();if(shipWa())$('offers').insertAdjacentHTML('beforeend',`<a class="sec" style="grid-column:1/-1;flex-direction:row;justify-content:center;gap:10px;text-decoration:none;color:inherit" target="_blank" rel="noopener" href="${esc(shipUrl())}"><span style="font-size:24px">📦</span><b>للإرساليات (مدينة أخرى) — تواصل عبر واتساب</b></a>`)}
function vSecs0(){
  const secs=[{id:'all',name:'🛍️ كل العروض',n:shown().length},...R.categories.map(c=>({...c,n:shown().filter(p=>p.category===c.id).length}))].filter(c=>c.n);
  $('offers').innerHTML=secs.length?secs.map((c,i)=>`<button type="button" class="sec" style="--i:${i}" data-cat="${esc(c.id)}"><b>${esc(c.name)}</b><small>${c.n} عرض</small></button>`).join(''):'<p class="muted">لا توجد عروض في هذه المنطقة حالياً.</p>';
}
function vList(){
  $('catName').textContent=cat==='all'?'كل العروض':(R.categories.find(c=>c.id===cat)||{}).name||'';
  const ps=shown().filter(p=>cat==='all'||p.category===cat);
  $('offers').innerHTML=ps.length?ps.map((p,i)=>`<article class="card ${p.soldOut?'out':''}" style="--i:${i}" data-id="${esc(p.id)}">${img(p.images[0])?`<img src="${esc(img(p.images[0]))}" alt="" loading="lazy">`:''}<h3>${esc(p.name)}</h3><b>${money(p.price)}</b>${p.soldOut?'<i>نفدت الكمية</i>':''}</article>`).join(''):'<p class="muted">لا توجد عروض في هذا القسم.</p>';
}
function vOffer(){
  if(!cur)return go({v:'secs'},true);
  const p=cur,im=p.images.map(img).filter(Boolean);
  $('page').innerHTML=(im.length?`<div class="gal">${im.map(u=>`<img src="${esc(u)}" alt="" data-lb>`).join('')}</div>${im.length>1?'<p class="muted" style="padding:0 0 8px">اسحب لرؤية باقي الصور · اضغط على الصورة لتكبيرها</p>':'<p class="muted" style="padding:0 0 8px">اضغط على الصورة لتكبيرها</p>'}`:'')+
  `<h2>${esc(p.name)}</h2><p style="color:var(--gold);font-weight:800;font-size:20px;margin:4px 0">${money(p.price)}</p>`+
  (p.desc?`<p style="line-height:1.9;white-space:pre-line;margin:8px 0">${esc(p.desc)}</p>`:'')+
  (p.sizes.length?`<div><b>المقاسات المتاحة:</b><br>${p.sizes.map(x=>`<span class="tg">${esc(x)}</span>`).join('')}</div>`:'')+
  (p.colors.length?`<div style="margin-top:8px"><b>الألوان المتاحة:</b><br>${p.colors.map(x=>`<span class="tg">${esc(x)}</span>`).join('')}</div>`:'')+
  `<div class="qty"><button type="button" data-q="-1">−</button><span id="qv">${qty}</span><button type="button" data-q="1">+</button></div>
   <div class="cta"><button type="button" data-add>أضف إلى الطلب</button></div>`;
}
function addToCart(){
  const ex=cart.find(i=>i.id===cur.id);
  const add=Array.from({length:qty},()=>({size:'',color:''}));
  ex?ex.pieces.push(...add):cart.push({id:cur.id,name:cur.name,price:Number(cur.price),pieces:add});
  saveCart();toast('تمت الإضافة إلى طلبك');history.back();
}

/* ===== الخطوة 1: مراجعة الطلب والمقاس واللون لكل قطعة ===== */
function vCart(){
  if(!cart.length){$('page').innerHTML='<p class="muted">طلبك فارغ.</p><div class="cta"><button type="button" data-home>تصفّح العروض</button></div>';return}
  $('page').innerHTML='<h2 style="margin:6px 0 12px">1️⃣ راجع طلبك</h2>'+cart.map((it,k)=>{
    const p=prod(it.id),im=img((p.images||[])[0]);
    return `<div class="bx"><div class="it">${im?`<img src="${esc(im)}" alt="">`:'<div class="ph"></div>'}<div style="flex:1"><b>${esc(it.name)}</b><div style="color:var(--gold);font-weight:800">${money(it.price)}</div></div><button type="button" data-rm="${k}" aria-label="حذف" style="border:0;background:none;font-size:20px;cursor:pointer">🗑</button></div>
    <div class="mini"><button type="button" data-iq="${k}:-1">−</button><b>${it.pieces.length}</b><button type="button" data-iq="${k}:1">+</button><span class="muted">= ${money(it.price*it.pieces.length)}</span></div>`+
    ((list(p.sizes).length||list(p.colors).length)?it.pieces.map((pc,j)=>`<div class="piece"><b>القطعة ${j+1}</b>${list(p.sizes).length?`<select data-pi="${k}:${j}" data-k="size"><option value="">المقاس</option>${p.sizes.map(v=>`<option ${pc.size===v?'selected':''}>${esc(v)}</option>`).join('')}</select>`:''}${list(p.colors).length?`<select data-pi="${k}:${j}" data-k="color"><option value="">اللون</option>${p.colors.map(v=>`<option ${pc.color===v?'selected':''}>${esc(v)}</option>`).join('')}</select>`:''}</div>`).join(''):'')+'</div>';
  }).join('')+`<div class="tot"><span>مجموع العروض</span><span>${money(sub())}</span></div><div class="cta"><button type="button" data-next="ship">التالي: التوصيل ‹</button></div>`;
}
function nextFromCart(){
  for(const it of cart){const p=prod(it.id);
    if(list(p.sizes).length&&it.pieces.some(x=>!x.size))return toast(`اختر المقاس لكل قطعة من «${it.name}»`);
    if(list(p.colors).length&&it.pieces.some(x=>!x.color))return toast(`اختر اللون لكل قطعة من «${it.name}»`)}
  go({v:'ship'});
}

/* ===== الخطوة 2: التوصيل (صفحة مستقلة) ===== */
function vShip(){
  const opts=[...R.deliveries.map((d,i)=>({t:'d',i,ic:'🚚',n:d.name,s:'',p:money(d.price)})),...R.pickups.map((k,i)=>({t:'p',i,ic:'🏬',n:k.name,s:k.address,p:'مجاناً'}))];
  if(!method()&&opts.length===1)ship={t:opts[0].t,i:opts[0].i};
  $('page').innerHTML='<h2 style="margin:6px 0 12px">2️⃣ طريقة التوصيل أو الاستلام</h2>'+(opts.length?opts.map(o=>`<button type="button" class="opt ${ship&&ship.t===o.t&&ship.i===o.i?'on':''}" data-ship="${o.t}:${o.i}"><span style="font-size:26px">${o.ic}</span><b>${esc(o.n)}${o.s?`<small>${esc(o.s)}</small>`:''}</b><span>${o.p}</span></button>`).join(''):'<p class="muted">لم تُضف طرق توصيل لهذه المنطقة بعد. تواصل معنا عبر واتساب.</p>')+
  `<div class="cta"><button type="button" data-next="info">التالي: بيانات الطلب ‹</button></div>`;
}

/* ===== الخطوة 3: بيانات الطلب والإرسال ===== */
function vInfo(){
  const keep=['cn','cp','cp2','ca','cnote'].map(id=>$(id)?$(id).value:'');
  $('page').innerHTML=`<h2 style="margin:6px 0 4px">3️⃣ بيانات الطلب</h2>
  <label>الاسم</label><input id="cn" maxlength="60" autocomplete="name">
  <label>رقم الهاتف</label><input id="cp" type="tel" inputmode="tel" maxlength="16" autocomplete="tel">
  <label>رقم احتياطي (اختياري)</label><input id="cp2" type="tel" inputmode="tel" maxlength="16">
  ${ship&&ship.t==='d'?'<label>العنوان بالتفصيل</label><textarea id="ca" rows="2" maxlength="200"></textarea>':''}
  <label>ملاحظات (اختياري)</label><textarea id="cnote" rows="2" maxlength="300"></textarea>
  <input id="hp" tabindex="-1" autocomplete="off" aria-hidden="true" style="position:absolute;left:-9999px">
  <div class="bx" style="margin-top:14px"><div class="tot" style="padding:0"><span>العروض (${cnt()} قطعة)</span><span>${money(sub())}</span></div>
  <div class="tot" style="padding-top:6px;font-size:15px"><span>${ship&&ship.t==='p'?'الاستلام: '+esc(method().name):'التوصيل'}</span><span>${money(deliv())}</span></div>
  <div class="tot"><span>الإجمالي</span><span>${money(sub()+deliv())}</span></div></div>
  <div class="cta"><button type="button" id="sendBtn" data-send>إرسال الطلب</button></div>`;
  keep.forEach((v,k)=>{const e=$(['cn','cp','cp2','ca','cnote'][k]);if(e&&v)e.value=v});
}
async function send(){
  const name=$('cn').value.trim(),phone=$('cp').value.trim(),ph2=$('cp2').value.trim(),addr=($('ca')||{value:''}).value.trim(),ok_ph=v=>/^[0-9+\s-]{8,16}$/.test(v);
  if(!cart.length)return toast('طلبك فارغ');
  if(name.length<2||!ok_ph(phone))return toast('اكتب الاسم ورقم هاتف صحيحاً');
  if(ph2&&!ok_ph(ph2))return toast('الرقم الاحتياطي غير صحيح');
  if(!method())return toast('اختر طريقة التوصيل أو الاستلام');
  if(ship.t==='d'&&addr.length<3)return toast('اكتب عنوان التوصيل');
  try{if(Date.now()-Number(localStorage.getItem('lastOrder')||0)<30000)return toast('انتظر قليلاً قبل إرسال طلب جديد')}catch(e){}
  const btn=$('sendBtn');if($('hp').value)return;btn.disabled=true;btn.textContent='جاري الإرسال…';
  let no=null;try{const r=await sb.rpc('reserve_order_number');no=r.data==null?null:Number(r.data)}catch(e){}
  if(!no)no=Number(String(Date.now()).slice(-6));
  const items=await Promise.all(cart.map(async i=>({...i,thumb:await thumb(img((prod(i.id).images||[])[0]))})));
  const m=method();
  const order={orderNumber:no,regionId:R.id,region:R.name,mode:ship.t==='d'?'delivery':'pickup',method:m.name,pickupAddress:ship.t==='p'?m.address||'':'',deliveryPrice:deliv(),items,subtotal:sub(),total:sub()+deliv(),customer:{name,phone,phone2:ph2,address:ship.t==='d'?addr:'',notes:$('cnote').value.trim()},createdAt:new Date().toISOString()};
  let ok=false;
  try{const r=await sb.from('orders').insert({id:'o'+Date.now()+Math.random().toString(36).slice(2,7),order_number:no,status:'جديد',order});ok=!r.error;if(r.error)console.warn(r.error)}catch(e){console.warn(e)}
  const L=[`🛍️ طلب جديد رقم ${no}`,`📍 ${R.name}`,`👤 ${name}`,`📞 ${phone}${ph2?` / ${ph2}`:''}`,ship.t==='d'?`🚚 ${m.name}\n🏠 ${addr}`:`🏬 استلام: ${m.name}${m.address?` (${m.address})`:''}`,''];
  cart.forEach(i=>{L.push(`• ${i.pieces.length} × ${i.name} = ${money(i.price*i.pieces.length)}`);i.pieces.forEach((p,j)=>{if(p.size||p.color)L.push(`   - قطعة ${j+1}: ${[p.size,p.color].filter(Boolean).join(' / ')}`)})});
  L.push('',`💰 الإجمالي: ${money(order.total)}`);if(order.customer.notes)L.push(`📝 ${order.customer.notes}`);
  const wa=String(R.wa||S.shop.wa||'').replace(/\D/g,'');
  if(wa)window.open(`https://wa.me/${wa}?text=${encodeURIComponent(L.join('\n'))}`,'_blank');
  try{localStorage.setItem('lastOrder',Date.now());localStorage.removeItem('cart_'+R.id)}catch(e){}
  $('doneT').textContent=ok?'✅ تم إرسال طلبك':'⚠️ لم يصل الطلب للمتجر';
  $('doneP').textContent=ok?`رقم طلبك ${no}. سنتواصل معك قريباً.`:`رقم طلبك ${no}. تعذر الحفظ في النظام، أرسل الطلب عبر واتساب لتأكيده.`;
  cart=[];ship=null;cat=null;go({v:'secs'},true);openS('doneSheet');
}

/* ===== الأحداث ===== */
document.addEventListener('click',e=>{
  const t=e.target.closest('button,.card,[data-lb]');if(!t)return;const d=t.dataset;
  if(d.reg)pickReg(d.reg);
  else if(t.id==='back')openRegions();
  else if(t.id==='prev'||t.id==='toSecs')history.back();
  else if(d.cat!==undefined){cat=d.cat;go({v:'list'});scrollTo(0,0)}
  else if(t.classList.contains('card')){const p=prod(d.id);if(p.id&&!p.soldOut){cur=p;qty=1;go({v:'offer'});scrollTo(0,0)}}
  else if('lb' in d){$('lbi').src=t.src;$('lb').classList.remove('z');$('lb').classList.add('open')}
  else if('lbx' in d)$('lb').classList.remove('open');
  else if(d.q){qty=Math.min(20,Math.max(1,qty+Number(d.q)));$('qv').textContent=qty}
  else if('add' in d)addToCart();
  else if('home' in d)go({v:'secs'},true);
  else if(d.rm!==undefined){if(confirm('حذف هذا العرض من طلبك؟')){cart.splice(+d.rm,1);saveCart();show()}}
  else if(d.iq){const [k,n]=d.iq.split(':').map(Number),it=cart[k];if(n>0&&it.pieces.length<20)it.pieces.push({size:'',color:''});else if(n<0&&it.pieces.length>1)it.pieces.pop();saveCart();show()}
  else if(d.next==='ship')nextFromCart();
  else if(d.next==='info'){if(!method())return toast('اختر طريقة التوصيل أو الاستلام');go({v:'info'})}
  else if(d.ship){const [a,b]=d.ship.split(':');ship={t:a,i:+b};show()}
  else if('send' in d)send();
});
$('lb').addEventListener('click',e=>{if(e.target.id==='lbi')$('lb').classList.toggle('z')});
document.addEventListener('change',e=>{const t=e.target;if(t.dataset.pi){const [k,j]=t.dataset.pi.split(':').map(Number);cart[k].pieces[j][t.dataset.k]=t.value;saveCart()}});
$('barBtn').onclick=()=>go({v:'cart'});
$('doneBtn').onclick=()=>closeS('doneSheet');
document.querySelectorAll('.sheet').forEach(s=>s.addEventListener('click',e=>{if(e.target===s&&(s.id!=='regSheet'||R)&&s.id!=='doneSheet')s.classList.remove('open')}));
load();
</script>
</body>
</html>
