<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Ahmed Store</title>
<style>
:root{--navy:#0b2345;--gold:#c99a3e;--paper:#fffdf8;--bg:#f3eee3;--line:#e2d8c3;--mut:#5d6b7a;--ok:#1f7a4d;--bad:#b3261e}
*{box-sizing:border-box;margin:0}
body{font-family:system-ui,"Segoe UI","Noto Sans Arabic",Tahoma,sans-serif;background:var(--bg);color:var(--navy);padding-bottom:90px;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
header{background:var(--navy);color:#fff;padding:14px 16px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:20}
header img{height:46px;border-radius:10px;background:#fff}
header h1{font-size:20px;font-weight:800}
#tabs{display:flex;gap:8px;overflow-x:auto;padding:12px 16px;scrollbar-width:none;position:sticky;top:78px;background:var(--bg);z-index:10}
.chip{flex:none;border:1.5px solid var(--navy);background:transparent;border-radius:999px;padding:8px 18px;font-weight:700;cursor:pointer}
.chip.on{background:var(--navy);color:#fff}
#offers{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px;padding:4px 16px 16px;max-width:900px;margin:auto}
.card{background:var(--paper);border:1px solid var(--line);border-radius:14px;overflow:hidden;cursor:pointer;display:flex;flex-direction:column}
.card img{width:100%;aspect-ratio:4/5;object-fit:cover;background:#eee}
.card h3{font-size:15px;padding:10px 10px 2px}
.card b{color:var(--gold);padding:0 10px 10px;font-size:15px}
.card.out{opacity:.55}.card i{font-style:normal;color:var(--bad);padding:0 10px 10px;font-size:13px}
.muted{color:var(--mut);text-align:center;padding:30px 16px;grid-column:1/-1}
#bar{position:fixed;inset:auto 12px calc(12px + env(safe-area-inset-bottom)) 12px;z-index:30;display:none}
#bar button{width:100%;max-width:560px;margin:auto;display:flex;justify-content:space-between;background:var(--gold);color:#1b1300;border:0;border-radius:16px;padding:16px 20px;font-weight:800;font-size:17px;box-shadow:0 10px 30px #0b234555;cursor:pointer}
.sheet{position:fixed;inset:0;background:#0b234599;z-index:40;display:none;align-items:flex-end;justify-content:center}
.sheet.open{display:flex}
.sheet>div{background:var(--paper);width:100%;max-width:560px;max-height:92dvh;overflow-y:auto;border-radius:22px 22px 0 0;padding:20px 18px 0;position:relative}
.sheet h2{font-size:20px;margin-bottom:12px}
.x{position:absolute;top:14px;left:14px;border:0;background:var(--bg);border-radius:50%;width:34px;height:34px;font-size:18px;cursor:pointer}
.sheet img.big{width:100%;max-height:340px;object-fit:cover;border-radius:12px;margin-bottom:12px}
label{display:block;font-weight:700;margin:12px 0 5px;font-size:14px}
input,select,textarea{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:12px;background:#fff}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:3px solid var(--gold);outline-offset:1px}
.qty{display:flex;align-items:center;justify-content:center;gap:20px;margin:14px 0}
.qty button{width:46px;height:46px;border-radius:50%;border:1.5px solid var(--navy);background:#fff;font-size:24px;cursor:pointer}
.qty span{font-size:24px;font-weight:800;min-width:34px;text-align:center}
.cta{position:sticky;bottom:0;background:var(--paper);padding:12px 0 calc(14px + env(safe-area-inset-bottom));margin-top:14px}
.cta button{width:100%;padding:15px;border:0;border-radius:14px;background:var(--navy);color:#fff;font-weight:800;font-size:17px;cursor:pointer}
.cta button:disabled{opacity:.5}
.line{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);align-items:center}
.line button{border:0;background:none;color:var(--bad);font-size:18px;cursor:pointer}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.modes button{padding:12px;border-radius:12px;border:1.5px solid var(--navy);background:#fff;font-weight:700;cursor:pointer}
.modes button.on{background:var(--navy);color:#fff}
.tot{display:flex;justify-content:space-between;font-weight:800;font-size:18px;padding-top:12px}
#toast{position:fixed;top:90px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 18px;border-radius:12px;z-index:99;display:none}
</style>
</head>

<script>
/* ===== إعدادات سوبابيس ===== */
const CFG={url:'https://vnzdojkmoobsbqxnjfld.supabase.co',key:'sb_publishable_XVj-4RTYUTfc4Qgnj24C6A_7NxSM2jd'};
const sb=window.supabase?supabase.createClient(CFG.url,CFG.key):null;

/* ===== أدوات ===== */
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>Number(n||0).toLocaleString('en')+' جنيه';
const img=u=>/^(data:image\/|https:\/\/)/.test(u||'')?u:'';
let tt;const toast=m=>{const t=$('toast');t.textContent=m;t.style.display='block';clearTimeout(tt);tt=setTimeout(()=>t.style.display='none',2600)};

/* ===== الحالة ===== */
const DEF={shop:{name:'Ahmed Store',wa:'249122970741'},categories:[],products:[],regions:[]};
let S=DEF,cat='all',cart=[],cur=null,qty=1,mode='delivery';

async function load(){
  if(!sb){$('offers').innerHTML='<p class="muted">تعذر تحميل النظام. تحقق من الإنترنت ثم أعد فتح الصفحة.</p>';return}
  try{const r=await sb.from('store_state').select('state').eq('id',1).maybeSingle();if(r.data&&r.data.state)S={...DEF,...r.data.state}}catch(e){console.warn(e)}
  render();
  try{sb.rpc('record_stat',{p_kind:'visit',p_key:null}).then(()=>{},()=>{})}catch(e){}
}

/* ===== العرض ===== */
function render(){
  $('shop').textContent=S.shop.name||'Ahmed Store';
  const cs=[{id:'all',name:'الكل'},...S.categories];
  $('tabs').innerHTML=cs.map(c=>`<button class="chip ${c.id===cat?'on':''}" data-cat="${esc(c.id)}">${esc(c.name)}</button>`).join('');
  const ps=S.products.filter(p=>cat==='all'||p.category===cat);
  $('offers').innerHTML=ps.length?ps.map(p=>`<article class="card ${p.soldOut?'out':''}" data-id="${esc(p.id)}">${img(p.image)?`<img src="${esc(img(p.image))}" alt="" loading="lazy">`:''}<h3>${esc(p.name)}</h3><b>${money(p.price)}</b>${p.soldOut?'<i>نفدت الكمية</i>':''}</article>`).join(''):'<p class="muted">لا توجد عروض في هذا القسم حالياً.</p>';
  bar();
}
const sub=()=>cart.reduce((a,i)=>a+i.price*i.qty,0);
const regionOf=()=>S.regions.find(r=>r.name===$('cr').value);
const deliv=()=>mode==='delivery'?Number((regionOf()||{}).price||0):0;
function bar(){
  const n=cart.reduce((a,i)=>a+i.qty,0);
  $('bar').style.display=n?'block':'none';
  $('barBtn').innerHTML=`<span>🛒 طلبك (${n})</span><span>${money(sub())}</span>`;
}

/* ===== نافذة العرض ===== */
function openOffer(id){
  const p=S.products.find(x=>x.id===id);if(!p||p.soldOut)return;
  cur=p;qty=1;$('qv').textContent=1;
  $('offerBody').innerHTML=`${img(p.image)?`<img class="big" src="${esc(img(p.image))}" alt="">`:''}<h2>${esc(p.name)}</h2><p style="color:var(--gold);font-weight:800;font-size:18px">${money(p.price)}</p>${p.desc?`<p style="margin-top:8px;line-height:1.7;color:var(--mut)">${esc(p.desc)}</p>`:''}<label>المقاس أو اللون (اختياري)</label><input id="onote" maxlength="60">`;
  $('offerSheet').classList.add('open');
}
function addToCart(){
  const note=$('onote').value.trim();
  const ex=cart.find(i=>i.id===cur.id&&i.note===note);
  if(ex)ex.qty+=qty;else cart.push({id:cur.id,name:cur.name,price:Number(cur.price),qty,note});
  $('offerSheet').classList.remove('open');bar();toast('تمت الإضافة إلى طلبك');
}

/* ===== نافذة الطلب ===== */
function openCart(){
  $('cr').innerHTML=S.regions.length?S.regions.map(r=>`<option value="${esc(r.name)}">${esc(r.name)} — ${money(r.price)}</option>`).join(''):'<option value="">لا توجد مناطق</option>';
  drawCart();$('cartSheet').classList.add('open');
}
function drawCart(){
  $('cartLines').innerHTML=cart.length?cart.map((i,k)=>`<div class="line"><span>${i.qty} × ${esc(i.name)}${i.note?` (${esc(i.note)})`:''}</span><span>${money(i.price*i.qty)} <button type="button" data-rm="${k}" aria-label="حذف">🗑</button></span></div>`).join(''):'<p class="muted">طلبك فارغ.</p>';
  $('delivBox').style.display=mode==='delivery'?'block':'none';
  document.querySelectorAll('[data-mode]').forEach(b=>b.classList.toggle('on',b.dataset.mode===mode));
  $('ctot').textContent=money(sub()+deliv());
  bar();
}
async function send(){
  const name=$('cn').value.trim(),phone=$('cp').value.trim(),addr=$('ca').value.trim();
  if(!cart.length)return toast('أضف عرضاً واحداً على الأقل');
  if(!name||!phone)return toast('اكتب الاسم ورقم الهاتف');
  if(mode==='delivery'&&(!$('cr').value||!addr))return toast('اختر المنطقة واكتب العنوان');
  const btn=$('sendBtn');btn.disabled=true;btn.textContent='جاري الإرسال…';
  let no=null;try{const r=await sb.rpc('reserve_order_number');no=r.data==null?null:Number(r.data)}catch(e){}
  if(!no)no=Number(String(Date.now()).slice(-6));
  const order={orderNumber:no,mode,region:mode==='delivery'?$('cr').value:'',deliveryPrice:deliv(),items:cart,subtotal:sub(),total:sub()+deliv(),customer:{name,phone,address:mode==='delivery'?addr:'',notes:$('cnote').value.trim()},createdAt:new Date().toISOString()};
  let ok=false;
  try{const r=await sb.from('orders').insert({id:'o'+Date.now()+Math.random().toString(36).slice(2,7),order_number:no,status:'جديد',order});ok=!r.error;if(r.error)console.warn(r.error)}catch(e){console.warn(e)}
  const lines=[`🛍️ طلب جديد رقم ${no}`,`👤 ${name}`,`📞 ${phone}`,mode==='delivery'?`🚚 توصيل: ${order.region}\n🏠 ${addr}`:'🏬 استلام من المحل',''].concat(cart.map(i=>`• ${i.qty} × ${i.name}${i.note?` (${i.note})`:''} = ${money(i.price*i.qty)}`),['',`💰 الإجمالي: ${money(order.total)}`]);
  if(order.customer.notes)lines.push(`📝 ${order.customer.notes}`);
  const wa=String(S.shop.wa||'').replace(/\D/g,'');
  if(wa)window.open(`https://wa.me/${wa}?text=${encodeURIComponent(lines.join('\n'))}`,'_blank');
  $('cartSheet').classList.remove('open');
  $('doneT').textContent=ok?'✅ تم إرسال طلبك':'⚠️ لم يصل الطلب للمتجر';
  $('doneP').textContent=ok?`رقم طلبك ${no}. سنتواصل معك قريباً.`:`رقم طلبك ${no}. تعذر الحفظ في النظام، أرسل الطلب عبر واتساب لتأكيده.`;
  $('doneSheet').classList.add('open');
  cart=[];btn.disabled=false;btn.textContent='إرسال الطلب';bar();
}

/* ===== الأحداث ===== */
document.addEventListener('click',e=>{
  const t=e.target.closest('button,.card,.sheet');if(!t)return;
  if(t.dataset.cat!==undefined){cat=t.dataset.cat;render()}
  else if(t.classList.contains('card'))openOffer(t.dataset.id);
  else if(t.hasAttribute('data-close'))t.closest('.sheet').classList.remove('open');
  else if(t.dataset.mode){mode=t.dataset.mode;drawCart()}
  else if(t.dataset.rm!==undefined){cart.splice(+t.dataset.rm,1);drawCart()}
  else if(t.classList.contains('sheet')&&e.target===t&&t.id!=='doneSheet')t.classList.remove('open');
});
$('qm').onclick=()=>{qty=Math.max(1,qty-1);$('qv').textContent=qty};
$('qp').onclick=()=>{qty=Math.min(99,qty+1);$('qv').textContent=qty};
$('addBtn').onclick=addToCart;$('barBtn').onclick=openCart;$('sendBtn').onclick=send;
$('cr').onchange=drawCart;$('doneBtn').onclick=()=>$('doneSheet').classList.remove('open');
load();
</script>
</body>
</html>
