<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Ahmed Store</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--navy:#0b2345;--gold:#c99a3e;--paper:#fffdf8;--bg:#f3eee3;--line:#e2d8c3;--mut:#5d6b7a;--ok:#1f7a4d;--bad:#b3261e}
*{box-sizing:border-box;margin:0}
body{font-family:Tajawal,system-ui,sans-serif;background:var(--bg);color:var(--navy);padding-bottom:90px;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
header{background:var(--navy);color:#fff;padding:14px 16px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:20}
header img{height:46px;border-radius:10px;background:#fff}
header h1{font-size:20px;font-weight:800}
#tabs{display:flex;gap:8px;overflow-x:auto;padding:12px 16px;scrollbar-width:none;position:sticky;top:78px;background:var(--bg);z-index:10}
.chip{flex:none;border:1.5px solid var(--navy);background:transparent;border-radius:999px;padding:8px 18px;font-weight:700;cursor:pointer}
.chip.on{background:var(--navy);color:#fff}
#offers{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px;padding:4px 16px 16px;max-width:900px;margin:auto}
.card{background:var(--paper);border:1px solid var(--line);border-radius:14px;overflow:hidden;cursor:pointer;display:flex;flex-direction:column}
.card img{width:100%;aspect-ratio:4/5;object-fit:cover;background:#eee}
.card h3{font-size:15px;padding:10px 10px 2px}
.card b{color:var(--gold);padding:0 10px 10px;font-size:15px}
.card.out{opacity:.55}.card i{font-style:normal;color:var(--bad);padding:0 10px 10px;font-size:13px}
.muted{color:var(--mut);text-align:center;padding:30px 16px;grid-column:1/-1}
#bar{position:fixed;inset:auto 12px calc(12px + env(safe-area-inset-bottom)) 12px;z-index:30;display:none}
#bar button{width:100%;max-width:560px;margin:auto;display:flex;justify-content:space-between;background:var(--gold);color:#1b1300;border:0;border-radius:16px;padding:16px 20px;font-weight:800;font-size:17px;box-shadow:0 10px 30px #0b234555;cursor:pointer}
.sheet{position:fixed;inset:0;background:#0b234599;z-index:40;display:none;align-items:flex-end;justify-content:center}
.sheet.open{display:flex}
.sheet>div{background:var(--paper);width:100%;max-width:560px;max-height:92dvh;overflow-y:auto;border-radius:22px 22px 0 0;padding:20px 18px 0;position:relative}
.sheet h2{font-size:20px;margin-bottom:12px}
.x{position:absolute;top:14px;left:14px;border:0;background:var(--bg);border-radius:50%;width:34px;height:34px;font-size:18px;cursor:pointer}
.sheet img.big{width:100%;max-height:340px;object-fit:cover;border-radius:12px;margin-bottom:12px}
label{display:block;font-weight:700;margin:12px 0 5px;font-size:14px}
input,select,textarea{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:12px;background:#fff}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:3px solid var(--gold);outline-offset:1px}
.qty{display:flex;align-items:center;justify-content:center;gap:20px;margin:14px 0}
.qty button{width:46px;height:46px;border-radius:50%;border:1.5px solid var(--navy);background:#fff;font-size:24px;cursor:pointer}
.qty span{font-size:24px;font-weight:800;min-width:34px;text-align:center}
.cta{position:sticky;bottom:0;background:var(--paper);padding:12px 0 calc(14px + env(safe-area-inset-bottom));margin-top:14px}
.cta button{width:100%;padding:15px;border:0;border-radius:14px;background:var(--navy);color:#fff;font-weight:800;font-size:17px;cursor:pointer}
.cta button:disabled{opacity:.5}
.line{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);align-items:center}
.line button{border:0;background:none;color:var(--bad);font-size:18px;cursor:pointer}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.modes button{padding:12px;border-radius:12px;border:1.5px solid var(--navy);background:#fff;font-weight:700;cursor:pointer}
.modes button.on{background:var(--navy);color:#fff}
.tot{display:flex;justify-content:space-between;font-weight:800;font-size:18px;padding-top:12px}
#toast{position:fixed;top:90px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 18px;border-radius:12px;z-index:99;display:none}
</style>
</head>
